<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SONORA — Offline Music</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --accent:#8b5cf6;
    --accent2:#6366f1;
    --bg:#08080d;
    --panel:rgba(255,255,255,.055);
    --panel2:rgba(255,255,255,.08);
    --text:#fff;
    --muted:#9b9ba7;
    --border:rgba(255,255,255,.09);
}

body{
    font-family:Inter,Segoe UI,Arial,sans-serif;
    background:
        radial-gradient(circle at 15% 10%,rgba(139,92,246,.20),transparent 30%),
        radial-gradient(circle at 90% 85%,rgba(99,102,241,.15),transparent 30%),
        var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
}

button,input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
    color:inherit;
}

.app{
    display:grid;
    grid-template-columns:250px 1fr;
    min-height:100vh;
}

/* SIDEBAR */

.sidebar{
    padding:28px 18px;
    border-right:1px solid var(--border);
    background:rgba(0,0,0,.18);
    backdrop-filter:blur(30px);
    position:fixed;
    width:250px;
    height:100vh;
    z-index:10;
}

.logo{
    display:flex;
    align-items:center;
    gap:11px;
    font-weight:800;
    font-size:21px;
    letter-spacing:1px;
    margin:4px 10px 38px;
}

.logoIcon{
    width:38px;
    height:38px;
    border-radius:13px;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 8px 30px rgba(99,102,241,.35);
}

.sectionTitle{
    color:#666673;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.5px;
    margin:20px 12px 9px;
    text-transform:uppercase;
}

.navBtn{
    width:100%;
    padding:12px 13px;
    margin:3px 0;
    border-radius:12px;
    background:transparent;
    color:#aaaab5;
    display:flex;
    align-items:center;
    gap:13px;
    text-align:left;
    transition:.2s;
}

.navBtn:hover,
.navBtn.active{
    background:var(--panel2);
    color:#fff;
}

.navBtn span{
    font-size:18px;
}

.bottomSide{
    position:absolute;
    bottom:25px;
    left:18px;
    right:18px;
}

/* MAIN */

.main{
    grid-column:2;
    padding:28px 34px 150px;
    max-width:1500px;
    width:100%;
    margin:auto;
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-bottom:35px;
}

.search{
    flex:1;
    max-width:580px;
    position:relative;
}

.search input{
    width:100%;
    padding:14px 20px 14px 46px;
    border-radius:16px;
    border:1px solid var(--border);
    outline:none;
    color:white;
    background:var(--panel);
    backdrop-filter:blur(20px);
}

.search input::placeholder{
    color:#777783;
}

.searchIcon{
    position:absolute;
    left:17px;
    top:13px;
    color:#777783;
}

.topActions{
    display:flex;
    gap:9px;
}

.iconBtn{
    width:43px;
    height:43px;
    border-radius:13px;
    background:var(--panel);
    border:1px solid var(--border);
    display:grid;
    place-items:center;
    transition:.2s;
}

.iconBtn:hover{
    background:var(--panel2);
    transform:translateY(-1px);
}

.hero{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:30px;
    padding:34px;
    border-radius:26px;
    border:1px solid var(--border);
    background:
        linear-gradient(120deg,rgba(139,92,246,.17),rgba(255,255,255,.035));
    backdrop-filter:blur(25px);
    margin-bottom:34px;
    overflow:hidden;
    position:relative;
}

.hero:after{
    content:"";
    width:330px;
    height:330px;
    background:var(--accent);
    filter:blur(130px);
    opacity:.13;
    position:absolute;
    right:-100px;
    top:-140px;
}

.heroText{
    position:relative;
    z-index:2;
}

.eyebrow{
    color:#a78bfa;
    font-size:12px;
    font-weight:800;
    letter-spacing:2px;
    margin-bottom:10px;
}

.hero h1{
    font-size:clamp(30px,4vw,50px);
    line-height:1.02;
    margin-bottom:12px;
}

.hero p{
    color:var(--muted);
    max-width:520px;
    line-height:1.6;
}

.importBtn{
    position:relative;
    z-index:2;
    padding:14px 20px;
    border-radius:14px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    font-weight:750;
    box-shadow:0 12px 30px rgba(99,102,241,.25);
    white-space:nowrap;
}

.importBtn:hover{
    transform:translateY(-2px);
}

/* CONTENT */

.heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:17px;
}

.heading h2{
    font-size:21px;
}

.heading span{
    color:#777783;
    font-size:13px;
}

.songGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:19px;
}

.card{
    padding:11px;
    border:1px solid transparent;
    border-radius:19px;
    background:rgba(255,255,255,.035);
    transition:.25s;
    position:relative;
    overflow:hidden;
}

.card:hover{
    background:rgba(255,255,255,.07);
    border-color:var(--border);
    transform:translateY(-3px);
}

.cover{
    aspect-ratio:1;
    border-radius:14px;
    overflow:hidden;
    background:linear-gradient(135deg,#181822,#29293b);
    position:relative;
}

.cover img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.defaultCover{
    width:100%;
    height:100%;
    display:grid;
    place-items:center;
    font-size:43px;
    background:
        radial-gradient(circle at 30% 30%,var(--accent),transparent 40%),
        linear-gradient(135deg,#171722,#29293b);
}

.playOverlay{
    position:absolute;
    right:9px;
    bottom:9px;
    width:43px;
    height:43px;
    border-radius:50%;
    background:white;
    color:#111;
    display:grid;
    place-items:center;
    opacity:0;
    transform:translateY(8px);
    transition:.2s;
    box-shadow:0 8px 20px rgba(0,0,0,.3);
}

.card:hover .playOverlay{
    opacity:1;
    transform:none;
}

.songInfo{
    padding:12px 3px 5px;
}

.songName{
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.artist{
    color:#777783;
    font-size:12px;
    margin-top:5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.empty{
    border:1px dashed rgba(255,255,255,.12);
    padding:55px 20px;
    border-radius:20px;
    text-align:center;
    color:#777783;
}

.emptyIcon{
    font-size:45px;
    margin-bottom:12px;
}

/* PLAYER */

.player{
    position:fixed;
    left:250px;
    right:0;
    bottom:0;
    height:92px;
    border-top:1px solid var(--border);
    background:rgba(10,10,15,.84);
    backdrop-filter:blur(30px);
    z-index:20;
    display:grid;
    grid-template-columns:1fr 1.4fr 1fr;
    align-items:center;
    gap:25px;
    padding:13px 25px;
}

.nowPlaying{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.miniCover{
    width:55px;
    height:55px;
    border-radius:11px;
    overflow:hidden;
    flex:none;
    background:linear-gradient(135deg,var(--accent),#222);
}

.miniCover img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.miniDefault{
    width:100%;
    height:100%;
    display:grid;
    place-items:center;
}

.npText{
    min-width:0;
}

.npTitle{
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.npArtist{
    font-size:11px;
    color:#777783;
    margin-top:4px;
}

.controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
}

.control{
    background:transparent;
    color:#aaaab5;
    font-size:18px;
    width:30px;
    height:30px;
}

.control:hover{
    color:white;
}

.playMain{
    width:43px;
    height:43px;
    border-radius:50%;
    background:white;
    color:#111;
    display:grid;
    place-items:center;
    font-size:17px;
}

.rightControls{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:13px;
}

.volume{
    width:100px;
    accent-color:var(--accent);
}

.progressWrap{
    position:absolute;
    top:-4px;
    left:0;
    right:0;
    height:4px;
}

.progress{
    width:100%;
    height:4px;
    appearance:none;
    background:transparent;
    cursor:pointer;
}

.progress::-webkit-slider-runnable-track{
    height:4px;
    background:rgba(255,255,255,.1);
}

.progress::-webkit-slider-thumb{
    appearance:none;
    width:12px;
    height:12px;
    margin-top:-4px;
    border-radius:50%;
    background:var(--accent);
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(10px);
    z-index:100;
    display:none;
    place-items:center;
    padding:20px;
}

.modal.show{
    display:grid;
}

.modalBox{
    width:min(500px,100%);
    padding:25px;
    border-radius:23px;
    background:#15151d;
    border:1px solid var(--border);
    box-shadow:0 30px 100px rgba(0,0,0,.5);
}

.modalTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modalTop h3{
    font-size:20px;
}

.themeGrid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:12px;
}

.theme{
    height:55px;
    border-radius:14px;
    border:2px solid transparent;
    cursor:pointer;
}

.theme:hover{
    border-color:white;
}

.theme1{background:#8b5cf6}
.theme2{background:#06b6d4}
.theme3{background:#22c55e}
.theme4{background:#f97316}
.theme5{background:#ef4444}
.theme6{background:#ec4899}
.theme7{background:#eab308}
.theme8{background:#6366f1}

.fileInput{
    display:none;
}

/* MOBILE */

@media(max-width:800px){
    .app{
        display:block;
    }

    .sidebar{
        position:fixed;
        width:100%;
        height:65px;
        bottom:0;
        top:auto;
        border-right:0;
        border-top:1px solid var(--border);
        padding:6px;
        background:rgba(10,10,15,.9);
    }

    .logo,
    .sectionTitle,
    .bottomSide{
        display:none;
    }

    .sidebar nav{
        display:flex;
        justify-content:space-around;
    }

    .navBtn{
        width:auto;
        flex-direction:column;
        gap:2px;
        padding:7px 12px;
        font-size:10px;
    }

    .navBtn span{
        font-size:17px;
    }

    .main{
        margin:0;
        padding:20px 16px 180px;
    }

    .topbar{
        margin-bottom:20px;
    }

    .search{
        max-width:none;
    }

    .hero{
        padding:25px;
        flex-direction:column;
        align-items:flex-start;
    }

    .player{
        left:0;
        bottom:65px;
        height:90px;
        grid-template-columns:1fr auto;
        padding:10px 14px;
    }

    .controls{
        gap:8px;
    }

    .rightControls{
        display:none;
    }

    .songGrid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">
    <div class="logo">
        <div class="logoIcon">♫</div>
        SONORA
    </div>

    <div class="sectionTitle">Library</div>

    <nav>
        <button class="navBtn active" data-view="all">
            <span>◉</span> All Songs
        </button>

        <button class="navBtn" data-view="favorites">
            <span>♡</span> Favorites
        </button>

        <button class="navBtn" data-view="recent">
            <span>◷</span> Recently Played
        </button>
    </nav>

    <div class="sectionTitle">Your Music</div>

    <button class="navBtn" id="importSide">
        <span>＋</span> Import Music
    </button>

    <div class="bottomSide">
        <button class="navBtn" id="themeBtn">
            <span>◐</span> Appearance
        </button>
    </div>
</aside>

<main class="main">

    <div class="topbar">
        <div class="search">
            <span class="searchIcon">⌕</span>
            <input id="search" placeholder="Search your music...">
        </div>

        <div class="topActions">
            <button class="iconBtn" id="themeTop">◐</button>
            <button class="iconBtn" id="importTop">＋</button>
        </div>
    </div>

    <section class="hero">
        <div class="heroText">
            <div class="eyebrow">YOUR PERSONAL MUSIC SPACE</div>
            <h1>Your music.<br>Anywhere.</h1>
            <p>
                Keep your favorite music organized in one beautiful,
                distraction-free offline library.
            </p>
        </div>

        <button class="importBtn" id="heroImport">
            ＋ Import Music
        </button>
    </section>

    <div class="heading">
        <h2 id="viewTitle">All Songs</h2>
        <span id="songCount">0 songs</span>
    </div>

    <div id="songGrid" class="songGrid"></div>

</main>

</div>

<!-- PLAYER -->

<div class="player">

    <div class="progressWrap">
        <input id="progress" class="progress" type="range" min="0" max="100" value="0">
    </div>

    <div class="nowPlaying">
        <div class="miniCover" id="miniCover">
            <div class="miniDefault">♫</div>
        </div>

        <div class="npText">
            <div class="npTitle" id="npTitle">Nothing playing</div>
            <div class="npArtist" id="npArtist">Choose a song</div>
        </div>

        <button class="control" id="likeBtn">♡</button>
    </div>

    <div class="controls">
        <button class="control" id="shuffleBtn">⤨</button>
        <button class="control" id="prevBtn">⏮</button>
        <button class="playMain" id="playBtn">▶</button>
        <button class="control" id="nextBtn">⏭</button>
        <button class="control" id="repeatBtn">↻</button>
    </div>

    <div class="rightControls">
        <span>🔊</span>
        <input class="volume" id="volume" type="range" min="0" max="1" step=".01" value=".8">
    </div>

</div>

<!-- FILE INPUT -->

<input id="fileInput" class="fileInput" type="file"
       accept="audio/*" multiple>

<!-- THEME MODAL -->

<div class="modal" id="themeModal">

    <div class="modalBox">

        <div class="modalTop">
            <h3>Appearance</h3>
            <button class="iconBtn" id="closeTheme">×</button>
        </div>

        <p style="color:#888;font-size:13px">
            Choose your accent color.
        </p>

        <div class="themeGrid">
            <button class="theme theme1" data-color="#8b5cf6"></button>
            <button class="theme theme2" data-color="#06b6d4"></button>
            <button class="theme theme3" data-color="#22c55e"></button>
            <button class="theme theme4" data-color="#f97316"></button>
            <button class="theme theme5" data-color="#ef4444"></button>
            <button class="theme theme6" data-color="#ec4899"></button>
            <button class="theme theme7" data-color="#eab308"></button>
            <button class="theme theme8" data-color="#6366f1"></button>
        </div>

    </div>

</div>

<audio id="audio"></audio>

<script>
/* =========================================================
   SONORA — PREMIUM OFFLINE MUSIC PLAYER
   ========================================================= */

const audio = document.getElementById("audio");
const fileInput = document.getElementById("fileInput");
const songGrid = document.getElementById("songGrid");
const search = document.getElementById("search");

const npTitle = document.getElementById("npTitle");
const npArtist = document.getElementById("npArtist");
const miniCover = document.getElementById("miniCover");

const playBtn = document.getElementById("playBtn");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");

const songCount = document.getElementById("songCount");
const viewTitle = document.getElementById("viewTitle");

const themeModal = document.getElementById("themeModal");

let songs = [];
let currentIndex = -1;

let shuffle = false;
let repeat = false;
let currentView = "all";

let recent = JSON.parse(localStorage.getItem("sonoraRecent") || "[]");
let favorites = JSON.parse(localStorage.getItem("sonoraFavorites") || "[]");

let accent = localStorage.getItem("sonoraAccent") || "#8b5cf6";

document.documentElement.style.setProperty("--accent",accent);


/* ---------- IMPORT ---------- */

function openImporter(){
    fileInput.click();
}

document.getElementById("heroImport").onclick = openImporter;
document.getElementById("importTop").onclick = openImporter;
document.getElementById("importSide").onclick = openImporter;

fileInput.addEventListener("change", e=>{
    const files = [...e.target.files];

    files.forEach(file=>{
        if(!file.type.startsWith("audio/")) return;

        const exists = songs.some(s =>
            s.name === file.name &&
            s.size === file.size
        );

        if(!exists){
            songs.push({
                id:crypto.randomUUID(),
                name:file.name.replace(/\.[^/.]+$/,""),
                artist:"Local music",
                size:file.size,
                file:file,
                url:URL.createObjectURL(file),
                favorite:false,
                played:0
            });
        }
    });

    render();
    fileInput.value="";
});


/* ---------- RENDER ---------- */

function getVisibleSongs(){

    let list=[...songs];

    if(currentView==="favorites"){
        list=list.filter(s=>favorites.includes(s.id));
    }

    if(currentView==="recent"){
        list=list
            .filter(s=>recent.includes(s.id))
            .sort((a,b)=>recent.indexOf(a.id)-recent.indexOf(b.id));
    }

    const q=search.value.toLowerCase().trim();

    if(q){
        list=list.filter(s=>
            s.name.toLowerCase().includes(q) ||
            s.artist.toLowerCase().includes(q)
        );
    }

    return list;
}

function render(){

    const list=getVisibleSongs();

    songGrid.innerHTML="";

    songCount.textContent =
        `${list.length} ${list.length===1?"song":"songs"}`;

    if(!list.length){

        songGrid.innerHTML=`
        <div class="empty" style="grid-column:1/-1">
            <div class="emptyIcon">♫</div>
            <div style="font-size:16px;color:#aaa;margin-bottom:7px">
                ${songs.length ? "Nothing here yet" : "Your library is empty"}
            </div>
            <div>
                ${songs.length
                    ? "Try another view or search."
                    : "Import your music to start listening offline."}
            </div>
        </div>`;

        return;
    }

    list.forEach(song=>{

        const index=songs.indexOf(song);

        const card=document.createElement("div");
        card.className="card";

        const liked=favorites.includes(song.id);

        card.innerHTML=`
            <div class="cover">
                <div class="defaultCover">♫</div>

                <button class="playOverlay"
                        data-play="${index}">
                    ▶
                </button>
            </div>

            <div class="songInfo">
                <div class="songName" title="${escapeHtml(song.name)}">
                    ${escapeHtml(song.name)}
                </div>

                <div class="artist">
                    ${liked ? "♥ " : ""}${escapeHtml(song.artist)}
                </div>
            </div>
        `;

        card.querySelector("[data-play]")
            .onclick=()=>playSong(index);

        songGrid.appendChild(card);
    });
}


/* ---------- PLAYBACK ---------- */

function playSong(index){

    if(index<0 || index>=songs.length) return;

    currentIndex=index;

    const song=songs[index];

    audio.src=song.url;

    audio.play().catch(()=>{});

    npTitle.textContent=song.name;
    npArtist.textContent=song.artist;

    playBtn.textContent="Ⅱ";

    song.played=(song.played||0)+1;

    recent=recent.filter(id=>id!==song.id);
    recent.unshift(song.id);
    recent=recent.slice(0,30);

    localStorage.setItem(
        "sonoraRecent",
        JSON.stringify(recent)
    );

    updateLike();

    render();
}

function togglePlay(){

    if(currentIndex===-1){

        if(songs.length) playSong(0);

        return;
    }

    if(audio.paused){
        audio.play();
        playBtn.textContent="Ⅱ";
    }else{
        audio.pause();
        playBtn.textContent="▶";
    }
}

playBtn.onclick=togglePlay;

document.getElementById("nextBtn").onclick=nextSong;

document.getElementById("prevBtn").onclick=()=>{

    if(!songs.length) return;

    if(audio.currentTime>3){
        audio.currentTime=0;
        return;
    }

    let next=currentIndex-1;

    if(next<0) next=songs.length-1;

    playSong(next);
};

function nextSong(){

    if(!songs.length) return;

    let next;

    if(shuffle){

        next=Math.floor(Math.random()*songs.length);

        if(songs.length>1 && next===currentIndex){
            next=(next+1)%songs.length;
        }

    }else{

        next=currentIndex+1;

        if(next>=songs.length){

            if(repeat){
                next=0;
            }else{
                audio.pause();
                playBtn.textContent="▶";
                return;
            }
        }
    }

    playSong(next);
}

audio.addEventListener("ended",()=>{

    if(repeat){
        audio.currentTime=0;
        audio.play();
        return;
    }

    nextSong();
});


/* ---------- PROGRESS ---------- */

audio.addEventListener("timeupdate",()=>{

    if(!audio.duration) return;

    progress.value =
        (audio.currentTime/audio.duration)*100;
});

progress.addEventListener("input",()=>{

    if(!audio.duration) return;

    audio.currentTime =
        (progress.value/100)*audio.duration;
});


/* ---------- VOLUME ---------- */

volume.addEventListener("input",()=>{
    audio.volume=volume.value;
});

audio.volume=.8;


/* ---------- SHUFFLE / REPEAT ---------- */

document.getElementById("shuffleBtn").onclick=()=>{

    shuffle=!shuffle;

    document.getElementById("shuffleBtn").style.color =
        shuffle ? "var(--accent)" : "";
};

document.getElementById("repeatBtn").onclick=()=>{

    repeat=!repeat;

    document.getElementById("repeatBtn").style.color =
        repeat ? "var(--accent)" : "";
};


/* ---------- FAVORITES ---------- */

function updateLike(){

    if(currentIndex===-1) return;

    const id=songs[currentIndex].id;

    document.getElementById("likeBtn").textContent =
        favorites.includes(id) ? "♥" : "♡";

    document.getElementById("likeBtn").style.color =
        favorites.includes(id) ? "var(--accent)" : "";
}

document.getElementById("likeBtn").onclick=()=>{

    if(currentIndex===-1) return;

    const id=songs[currentIndex].id;

    if(favorites.includes(id)){
        favorites=favorites.filter(x=>x!==id);
    }else{
        favorites.push(id);
    }

    localStorage.setItem(
        "sonoraFavorites",
        JSON.stringify(favorites)
    );

    updateLike();
    render();
};


/* ---------- SEARCH ---------- */

search.addEventListener("input",render);


/* ---------- NAVIGATION ---------- */

document.querySelectorAll(".navBtn[data-view]")
.forEach(btn=>{

    btn.onclick=()=>{

        document.querySelectorAll(".navBtn[data-view]")
        .forEach(b=>b.classList.remove("active"));

        btn.classList.add("active");

        currentView=btn.dataset.view;

        if(currentView==="favorites")
            viewTitle.textContent="Favorites";

        else if(currentView==="recent")
            viewTitle.textContent="Recently Played";

        else
            viewTitle.textContent="All Songs";

        render();
    };
});


/* ---------- THEMES ---------- */

function openTheme(){
    themeModal.classList.add("show");
}

document.getElementById("themeBtn").onclick=openTheme;
document.getElementById("themeTop").onclick=openTheme;

document.getElementById("closeTheme").onclick=()=>{
    themeModal.classList.remove("show");
};

themeModal.onclick=e=>{
    if(e.target===themeModal)
        themeModal.classList.remove("show");
};

document.querySelectorAll(".theme").forEach(t=>{

    t.onclick=()=>{

        accent=t.dataset.color;

        document.documentElement
            .style.setProperty("--accent",accent);

        localStorage.setItem(
            "sonoraAccent",
            accent
        );
    };
});


/* ---------- KEYBOARD CONTROLS ---------- */

document.addEventListener("keydown",e=>{

    if(e.target.tagName==="INPUT") return;

    if(e.code==="Space"){
        e.preventDefault();
        togglePlay();
    }

    if(e.code==="ArrowRight"){
        audio.currentTime=Math.min(
            audio.duration||0,
            audio.currentTime+5
        );
    }

    if(e.code==="ArrowLeft"){
        audio.currentTime=Math.max(
            0,
            audio.currentTime-5
        );
    }

    if(e.code==="ArrowUp"){
        audio.volume=Math.min(
            1,
            audio.volume+.05
        );
        volume.value=audio.volume;
    }

    if(e.code==="ArrowDown"){
        audio.volume=Math.max(
            0,
            audio.volume-.05
        );
        volume.value=audio.volume;
    }
});


/* ---------- HELPERS ---------- */

function escapeHtml(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* ---------- START ---------- */

render();

</script>

</body>
</html>
